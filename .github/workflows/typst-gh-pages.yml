name: Build Typst and deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Download Typst release
        run: |
          version="v0.15.1"
          build="typst-x86_64-unknown-linux-musl"
          curl -L -o typst.tar.xz "github.com/typst/typst/releases/download/$version/$build.tar.xz"
          tar -xJf typst.tar.xz
          mv "$build/typst" .
          chmod +x typst
          export PATH="$PATH:."
          typst --version
      - name: Build site
        run: ./build.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
